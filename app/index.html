<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>ZY-KaiCam</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="finder-view" class="view">
      <video id="preview" autoplay></video>
      <div id="grid-overlay" class="hidden"></div>
      <div id="hud-top">
        <span id="hud-ble">…</span>
        <span id="hud-rec" class="hidden">● 录像</span>
        <span id="hud-mode">…</span>
      </div>
      <div id="hud-bottom">
        <span id="hud-param"></span>
        <span id="hud-zoom"></span>
      </div>
      <div id="debug" class="hidden"></div>
      <div id="flash-overlay"></div>
    </div>

    <div id="menu-view" class="view hidden">
      <div id="menu-title"></div>
      <ul id="menu-list"></ul>
    </div>

    <div id="about-view" class="view hidden">
      <div id="about-title"></div>
      <div id="about-body"></div>
    </div>

    <!-- 不属于任何 view：菜单/关于页里也要能看见 -->
    <div id="toast" class="hidden"></div>
    <div id="splash" class="hidden">
      <div id="splash-title"></div>
      <div id="splash-big" class="hidden"></div>
      <div id="splash-sub" class="hidden"></div>
      <div id="splash-hint" class="hidden"></div>
    </div>

    <div id="softkey-bar">
      <span id="sk-left"></span>
      <span id="sk-center"></span>
      <span id="sk-right"></span>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/format.js"></script>
  <script src="js/strings.js"></script>
  <script src="js/zhiyun.js"></script>
  <script src="js/ble.js"></script>
  <script src="js/session.js"></script>
  <script src="js/buttons.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/debug.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
